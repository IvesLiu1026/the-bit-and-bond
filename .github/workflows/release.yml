name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to release (for manual trigger)
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          cache: true

      - name: Rust tests
        run: cargo test -p the_bit_and_bond_server --locked

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust release binary
        run: cargo build -p the_bit_and_bond_server --release --locked

      - name: Package Rust binary
        run: |
          mkdir -p dist
          cp target/release/the_bit_and_bond_server dist/the_bit_and_bond_server
          tar -C dist -czf dist/the-bit-and-bond-server-linux-x64.tar.gz the_bit_and_bond_server

      - name: Flutter pub get
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Flutter tests
        working-directory: apps/client_flutter
        run: flutter test

      - name: Flutter analyze
        working-directory: apps/client_flutter
        run: flutter analyze

      - name: Hardcoded i18n guard
        working-directory: apps/client_flutter
        run: dart run tool/check_hardcoded_strings.dart --check

      - name: Build Flutter web release
        working-directory: apps/client_flutter
        run: flutter build web --release

      - name: Package Flutter web
        run: |
          mkdir -p dist
          cd apps/client_flutter/build/web
          zip -r ../../../../dist/the-bit-and-bond-web-release.zip .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/the-bit-and-bond-server-linux-x64.tar.gz
            dist/the-bit-and-bond-web-release.zip
