name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OpenAPI route coverage
        run: python3 scripts/check_openapi_routes.py

  rust:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://chen:chen@127.0.0.1:5432/the_bit_and_bond
      RUST_TEST_THREADS: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chen
          POSTGRES_PASSWORD: chen
          POSTGRES_DB: the_bit_and_bond
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chen -d the_bit_and_bond"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rust fmt
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test -p the_bit_and_bond_server --locked

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Hardcoded i18n guard
        run: dart run tool/check_hardcoded_strings.dart --check

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test
