    RegisterDmDeviceKeyRequest:
      type: object
      properties:
        device_id:
          type: string
        device_label:
          type: string
          nullable: true
        signing_public_key:
          type: string
        encryption_public_key:
          type: string
      required: [device_id, signing_public_key, encryption_public_key]

    RevokeDmDeviceKeyRequest:
