        sender_device_id:
          type: string
        recipient_device_id:
          type: string
        client_message_id:
          type: string
          format: uuid
          nullable: true
        protocol_version:
          type: string
          nullable: true
        ciphertext:
          type: string
        nonce:
          type: string
        sent_at_ms:
