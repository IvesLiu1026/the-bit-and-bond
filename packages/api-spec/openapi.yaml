        counterpart_player_id:
          type: string
        counterpart_guild_id:
          type: string
          format: uuid
        sender_device_id:
          type: string
        recipient_device_id:
          type: string
        client_message_id:
          type: string
          format: uuid
        protocol_version:
          type: string
        ciphertext:
          type: string
        nonce:
          type: string
        sent_at:
          type: string
          format: date-time
        sent_at_ms:
          type: integer
        encryption_mode:
          type: string
      required:
        - id
        - sender_hunter_id
        - recipient_hunter_id
        - counterpart_hunter_id
        - counterpart_name
        - counterpart_player_id
        - counterpart_guild_id
        - sender_device_id
        - recipient_device_id
        - client_message_id
        - protocol_version
        - ciphertext
        - nonce
        - sent_at
        - sent_at_ms
        - encryption_mode

    DirectMessageThread:
      type: object
      properties:
        conversation_key:
          type: string
        counterpart_hunter_id:
          type: string
          format: uuid
        counterpart_name:
          type: string
        counterpart_player_id:
          type: string
        counterpart_guild_id:
          type: string
          format: uuid
        counterpart_avatar_type:
          type: string
        last_message:
          type: string
        last_message_sender_hunter_id:
          type: string
          format: uuid
        last_message_sender_name:
          type: string
        last_message_at:
          type: string
          format: date-time
        last_message_at_ms:
          type: integer
        encryption_mode:
          type: string
        unread_count:
          type: integer
      required:
        - conversation_key
        - counterpart_hunter_id
        - counterpart_name
        - counterpart_player_id
        - counterpart_guild_id
        - counterpart_avatar_type
        - last_message
        - last_message_sender_hunter_id
        - last_message_sender_name
        - last_message_at
        - last_message_at_ms
        - encryption_mode
        - unread_count

    DmThreadRead:
      type: object
      properties:
        conversation_key:
          type: string
        hunter_id:
          type: string
          format: uuid
        counterpart_hunter_id:
          type: string
          format: uuid
        last_read_at:
          type: string
          format: date-time
      required: [conversation_key, hunter_id, counterpart_hunter_id, last_read_at]

    DmDeviceKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hunter_id:
          type: string
          format: uuid
        device_id:
          type: string
        device_label:
          type: string
          nullable: true
        signing_public_key:
          type: string
        encryption_public_key:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - hunter_id
        - device_id
        - signing_public_key
        - encryption_public_key
        - created_at
        - last_seen_at

    DmDeviceKeyBatch:
      type: object
      properties:
        hunter_id:
          type: string
          format: uuid
        keys:
          type: array
          items:
            $ref: '#/components/schemas/DmDeviceKey'
      required: [hunter_id, keys]

    MediaEncryptionMeta:
      type: object
      properties:
        mode:
          type: string
        protocol_version:
          type: string
          nullable: true
        sender_device_id:
          type: string
          nullable: true
        recipient_device_id:
          type: string
          nullable: true
        nonce:
          type: string
          nullable: true
        mac:
          type: string
          nullable: true
      required: [mode]

    MediaAsset:
      type: object
      properties:
        id:
          type: string
