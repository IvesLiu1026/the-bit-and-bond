        - sender_device_id
        - recipient_device_id
        - ciphertext
        - nonce

    DirectMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sender_hunter_id:
          type: string
          format: uuid
        recipient_hunter_id:
          type: string
          format: uuid
        counterpart_hunter_id:
          type: string
          format: uuid
        counterpart_name:
          type: string
        counterpart_player_id:
          type: string
        counterpart_guild_id:
          type: string
          format: uuid
        sender_name:
          type: string
        client_message_id:
          type: string
          format: uuid
        content:
          type: string
        sent_at:
          type: string
          format: date-time
        sent_at_ms:
          type: integer
        encryption_mode:
          type: string
        decryption_failed:
