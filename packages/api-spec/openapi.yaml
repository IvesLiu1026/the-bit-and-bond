openapi: 3.1.0
info:
  title: The Bit and Bond API
  version: 0.2.0
  description: >
    Client-facing REST contract for the current The Bit and Bond product shape.
    This spec reflects the guild/hunter/social/media architecture used by the
    Rust server and Flutter client. It intentionally replaces the old
    household/member contract.
servers:
  - url: http://127.0.0.1:18080
    description: Local development server
tags:
  - name: Health
  - name: Auth
  - name: Hunters
  - name: Quests
  - name: Social
  - name: Direct Messages
  - name: Media
  - name: Shop
  - name: Inventory
  - name: Voice
  - name: Chat
  - name: Realtime
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a new player account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedRegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with player ID or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedLoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/firebase:
    post:
      tags: [Auth]
      security: []
      summary: Login or create account with Firebase ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseLoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Validate and resolve the current session
      responses:
        '200':
          description: Current session information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/hunters:
    get:
      tags: [Hunters]
      summary: List hunters in the current guild
      responses:
        '200':
          description: Guild hunters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hunter'
    post:
      tags: [Hunters]
      summary: Create a member hunter in the current guild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHunterRequest'
      responses:
        '201':
          description: Hunter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hunter'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/hunters/roster:
    get:
      tags: [Hunters]
      summary: List guild roster for any authenticated hunter
      responses:
        '200':
          description: Guild roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hunter'

  /api/v1/hunters/me:
    get:
      tags: [Hunters]
      summary: Get current hunter profile
      responses:
        '200':
          description: Current hunter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hunter'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/hunters/{hunter_id}/stats:
    get:
      tags: [Hunters]
      summary: Get hunter stat XP breakdown
      parameters:
        - $ref: '#/components/parameters/HunterIdPath'
      responses:
        '200':
          description: Aggregated reward ledger stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HunterStats'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/hunters/{hunter_id}/pin:
    patch:
      tags: [Hunters]
      summary: Reset a member PIN
      parameters:
        - $ref: '#/components/parameters/HunterIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetHunterPinRequest'
      responses:
        '200':
          description: Updated hunter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hunter'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/quests:
    get:
      tags: [Quests]
      summary: List quests and habits in the current guild
      responses:
        '200':
          description: Quest list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quest'
    post:
      tags: [Quests]
      summary: Create a quest or habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestRequest'
      responses:
        '201':
          description: Quest created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/quests/{quest_id}/submit:
    post:
      tags: [Quests]
      summary: Submit quest or habit completion
      parameters:
        - $ref: '#/components/parameters/QuestIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuestRequest'
      responses:
        '200':
          description: Updated quest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/quests/{quest_id}/proof-media:
    post:
      tags: [Quests]
      summary: Upload quest or habit proof image
      parameters:
        - $ref: '#/components/parameters/QuestIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Proof media stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestProofMedia'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/quests/{quest_id}/review:
    post:
      tags: [Quests]
      summary: Approve or reject a submitted quest
      parameters:
        - $ref: '#/components/parameters/QuestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewQuestRequest'
      responses:
        '200':
          description: Review result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQuestResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/quests/proof-media/{media_id}/content:
    get:
      tags: [Quests]
      summary: Download uploaded quest proof media
      parameters:
        - $ref: '#/components/parameters/MediaIdPath'
      responses:
        '200':
          description: Quest proof media bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/v1/social/friends:
    get:
      tags: [Social]
      summary: List friend profiles
      responses:
        '200':
          description: Friend list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendProfile'
    post:
      tags: [Social]
      summary: Add a friend immediately by player ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerIdRequest'
      responses:
        '201':
          description: Friend linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendProfile'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/friends/request:
    post:
      tags: [Social]
      summary: Send a friend request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerIdRequest'
      responses:
        '200':
          description: Existing pending request returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '201':
          description: Friend request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'

  /api/v1/friends/requests/incoming:
    get:
      tags: [Social]
      summary: List incoming pending friend requests
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendRequest'

  /api/v1/friends/requests/{request_id}/respond:
    post:
      tags: [Social]
      summary: Accept or reject a friend request
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondBooleanRequest'
      responses:
        '200':
          description: Updated friend request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'

  /api/v1/social/profile:
    get:
      tags: [Social]
      summary: Get current social profile
      responses:
        '200':
          description: Social profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
    patch:
      tags: [Social]
      summary: Update current profile motto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSocialProfileRequest'
      responses:
        '200':
          description: Updated social profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'

  /api/v1/social/profile/pass-qr:
    get:
      tags: [Social]
      summary: Generate a short-lived player pass QR payload
      responses:
        '200':
          description: Player pass QR bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPassQr'

  /api/v1/social/guild/invites:
    get:
      tags: [Social]
      summary: List incoming guild invites for the current hunter
      responses:
        '200':
          description: Guild invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuildInvite'
    post:
      tags: [Social]
      summary: Invite a friend into the current guild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerIdRequest'
      responses:
        '200':
          description: Existing invite returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildInvite'
        '201':
          description: Guild invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildInvite'

  /api/v1/guilds/summon:
    post:
      tags: [Social]
      summary: Alias endpoint to invite a friend into the current guild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerIdRequest'
      responses:
        '200':
          description: Existing invite returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildInvite'
        '201':
          description: Guild invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildInvite'

  /api/v1/social/guild/invites/{invite_id}/respond:
    post:
      tags: [Social]
      summary: Accept or reject a guild invite
      parameters:
        - $ref: '#/components/parameters/InviteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondBooleanRequest'
      responses:
        '200':
          description: Updated guild invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildInvite'

  /api/v1/direct-messages/threads:
    get:
      tags: [Direct Messages]
      summary: List DM inbox threads
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: DM threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectMessageThread'

  /api/v1/direct-messages/threads/{counterpart_hunter_id}/read:
    post:
      tags: [Direct Messages]
      summary: Mark a DM thread as read
      parameters:
        - $ref: '#/components/parameters/CounterpartHunterIdPath'
      responses:
        '200':
          description: Read cursor updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmThreadRead'

  /api/v1/direct-messages/history:
    get:
      tags: [Direct Messages]
      summary: Load plaintext DM history
      parameters:
        - $ref: '#/components/parameters/CounterpartHunterIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/BeforeMsQuery'
      responses:
        '200':
          description: Plaintext DM history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectMessage'

  /api/v1/direct-messages/messages:
    post:
      tags: [Direct Messages]
      summary: Send a plaintext DM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersistDirectMessageRequest'
      responses:
        '200':
          description: Sent DM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectMessage'

  /api/v1/direct-messages/encrypted/history:
    get:
      tags: [Direct Messages]
      summary: Load encrypted DM history
      parameters:
        - $ref: '#/components/parameters/CounterpartHunterIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/BeforeMsQuery'
      responses:
        '200':
          description: Encrypted DM history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EncryptedDirectMessage'

  /api/v1/direct-messages/encrypted/messages:
    post:
      tags: [Direct Messages]
      summary: Send an encrypted DM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersistEncryptedDirectMessageRequest'
      responses:
        '200':
          description: Sent encrypted DM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptedDirectMessage'

  /api/v1/direct-messages/device-keys:
    get:
      tags: [Direct Messages]
      summary: Batch fetch active DM device keys
      parameters:
        - in: query
          name: hunter_ids
          required: true
          schema:
            type: string
          description: Comma-separated hunter IDs
      responses:
        '200':
          description: Device keys grouped by hunter
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DmDeviceKeyBatch'

  /api/v1/direct-messages/device-keys/{hunter_id}:
    get:
      tags: [Direct Messages]
      summary: Fetch active DM device keys for one hunter
      parameters:
        - $ref: '#/components/parameters/HunterIdPath'
      responses:
        '200':
          description: Active DM device keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DmDeviceKey'

  /api/v1/direct-messages/device-keys/register:
    post:
      tags: [Direct Messages]
      summary: Register a DM device key pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDmDeviceKeyRequest'
      responses:
        '200':
          description: Registered DM device key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmDeviceKey'

  /api/v1/direct-messages/device-keys/revoke:
    post:
      tags: [Direct Messages]
      summary: Revoke an existing DM device key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeDmDeviceKeyRequest'
      responses:
        '200':
          description: Revoked DM device key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmDeviceKey'

  /api/v1/media/vault:
    get:
      tags: [Media]
      summary: List media stored in the player's vault
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Vault media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaAsset'

  /api/v1/media/vault/upload:
    post:
      tags: [Media]
      summary: Upload media into the vault
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
                include_in_dump:
                  type: boolean
      responses:
        '200':
          description: Uploaded media asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'

  /api/v1/media/once/inbox:
    get:
      tags: [Media]
      summary: List one-time photo inbox deliveries
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: One-time inbox
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaOnceDelivery'

  /api/v1/media/once/send:
    post:
      tags: [Media]
      summary: Send a regular or one-time image to a friend
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, recipient_player_id]
              properties:
                file:
                  type: string
                  format: binary
                recipient_player_id:
                  type: string
                caption:
                  type: string
                ttl_seconds:
                  type: integer
                encryption_mode:
                  type: string
                  enum: [plaintext, e2ee]
                protocol_version:
                  type: string
                sender_device_id:
                  type: string
                recipient_device_id:
                  type: string
                encryption_nonce:
                  type: string
                encryption_mac:
                  type: string
      responses:
        '200':
          description: Created one-time delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaOnceDelivery'

  /api/v1/media/once/{delivery_id}/open:
    post:
      tags: [Media]
      summary: Open a one-time delivery and mint a short-lived access token
      parameters:
        - $ref: '#/components/parameters/DeliveryIdPath'
      responses:
        '200':
          description: Open result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaOnceOpen'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/media/once/{delivery_id}/content:
    get:
      tags: [Media]
      summary: Download one-time media content with a minted access token
      parameters:
        - $ref: '#/components/parameters/DeliveryIdPath'
      responses:
        '200':
          description: One-time media bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/v1/media/assets/{media_id}/content:
    get:
      tags: [Media]
      summary: Download vault media content
      parameters:
        - $ref: '#/components/parameters/MediaIdPath'
      responses:
        '200':
          description: Vault media bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/v1/media/photo-dumps:
    get:
      tags: [Media]
      summary: List photo dump exports
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Photo dump exports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhotoDumpExport'

  /api/v1/media/photo-dumps/export:
    post:
      tags: [Media]
      summary: Create a photo dump export from vault assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhotoDumpExportRequest'
      responses:
        '200':
          description: Photo dump export created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoDumpExport'

  /api/v1/shop/items:
    get:
      tags: [Shop]
      summary: List shop items for the current guild
      parameters:
        - in: query
          name: include_inactive
          schema:
            type: boolean
      responses:
        '200':
          description: Shop items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShopItem'
    post:
      tags: [Shop]
      summary: Create a guild shop item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopItemUpsertRequest'
      responses:
        '201':
          description: Shop item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopItem'

  /api/v1/shop/items/{item_id}:
    put:
      tags: [Shop]
      summary: Update a guild shop item
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopItemUpsertRequest'
      responses:
        '200':
          description: Updated shop item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopItem'
    delete:
      tags: [Shop]
      summary: Deactivate a guild shop item
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
      responses:
        '200':
          description: Deactivated shop item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopItem'

  /api/v1/shop/buy/{item_id}:
    post:
      tags: [Shop]
      summary: Buy a guild shop item
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyItemRequest'
      responses:
        '200':
          description: Purchase result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyItemResponse'

  /api/v1/inventory:
    get:
      tags: [Inventory]
      summary: List current hunter inventory
      responses:
        '200':
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'

  /api/v1/inventory/use/{item_id}:
    post:
      tags: [Inventory]
      summary: Use an inventory item
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
      responses:
        '200':
          description: Inventory use result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseInventoryItemResponse'

  /api/v1/telemetry/public-events:
    post:
      tags: [Telemetry]
      summary: Ingest public client telemetry events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryIngestRequest'
      responses:
        '202':
          description: Telemetry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryIngestResponse'

  /api/v1/telemetry/events:
    post:
      tags: [Telemetry]
      summary: Ingest authenticated hunter telemetry events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryIngestRequest'
      responses:
        '202':
          description: Telemetry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryIngestResponse'

  /api/v1/voice/token:
    post:
      tags: [Voice]
      summary: Issue a LiveKit access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceTokenRequest'
      responses:
        '200':
          description: LiveKit token bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceTokenResponse'

  /api/v1/chat/history:
    get:
      tags: [Chat]
      summary: List campfire chat history
      parameters:
        - in: query
          name: room_id
          schema:
            type: string
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/BeforeMsQuery'
      responses:
        '200':
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'

  /api/v1/chat/messages:
    post:
      tags: [Chat]
      summary: Send a campfire chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersistChatMessageRequest'
      responses:
        '200':
          description: Sent chat message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'

  /api/v1/realtime/ticket:
    post:
      tags: [Realtime]
      summary: Issue a short-lived WebSocket ticket
      responses:
        '200':
          description: Realtime ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'

  /api/v1/realtime/ws:
    get:
      tags: [Realtime]
      summary: Upgrade the connection to the guild realtime WebSocket
      parameters:
        - $ref: '#/components/parameters/RealtimeTicketQuery'
      responses:
        '101':
          description: WebSocket upgrade accepted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  parameters:
    HunterIdPath:
      in: path
      name: hunter_id
      required: true
      schema:
        type: string
        format: uuid
    CounterpartHunterIdPath:
      in: path
      name: counterpart_hunter_id
      required: true
      schema:
        type: string
        format: uuid
    CounterpartHunterIdQuery:
      in: query
      name: counterpart_hunter_id
      required: true
      schema:
        type: string
        format: uuid
    QuestIdPath:
      in: path
      name: quest_id
      required: true
      schema:
        type: string
        format: uuid
    ItemIdPath:
      in: path
      name: item_id
      required: true
      schema:
        type: string
        format: uuid
    DeliveryIdPath:
      in: path
      name: delivery_id
      required: true
      schema:
        type: string
        format: uuid
    MediaIdPath:
      in: path
      name: media_id
      required: true
      schema:
        type: string
        format: uuid
    RequestIdPath:
      in: path
      name: request_id
      required: true
      schema:
        type: string
        format: uuid
    InviteIdPath:
      in: path
      name: invite_id
      required: true
      schema:
        type: string
        format: uuid
    LimitQuery:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
    BeforeMsQuery:
      in: query
      name: before_ms
      schema:
        type: integer
    RealtimeTicketQuery:
      in: query
      name: ticket
      required: true
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
        now:
          type: string
          format: date-time
      required: [status, now]

    UnifiedRegisterRequest:
      type: object
      properties:
        account:
          type: string
        secret:
          type: string
        display_name:
          type: string
        avatar_type:
          type: string
      required: [account, secret, display_name]

    UnifiedLoginRequest:
      type: object
      properties:
        account:
          type: string
        secret:
          type: string
      required: [account, secret]

    FirebaseLoginRequest:
      type: object
      properties:
        id_token:
          type: string
        display_name:
          type: string
        avatar_type:
          type: string
      required: [id_token]

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        role:
          type: string
          enum: [player]
        guild_role:
          type: string
          enum: [master, member]
        guild_id:
          type: string
          format: uuid
        hunter_id:
          type: string
          format: uuid
          nullable: true
        invite_code:
          type: string
          nullable: true
        player_id:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        avatar_type:
          type: string
          nullable: true
      required:
        - access_token
        - token_type
        - expires_in
        - role
        - guild_role
        - guild_id

    MeResponse:
      type: object
      properties:
        sub:
          type: string
          format: uuid
        role:
          type: string
          enum: [player]
        guild_role:
          type: string
          enum: [master, member]
        guild_id:
          type: string
          format: uuid
        hunter_id:
          type: string
          format: uuid
          nullable: true
        player_id:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        avatar_type:
          type: string
          nullable: true
      required: [sub, role, guild_role, guild_id]

    CreateHunterRequest:
      type: object
      properties:
        name:
          type: string
        avatar_type:
          type: string
        pin_code:
          type: string
        player_id:
          type: string
          nullable: true
      required: [name, avatar_type, pin_code]

    ResetHunterPinRequest:
      type: object
      properties:
        pin_code:
          type: string
      required: [pin_code]

    Hunter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        guild_id:
          type: string
          format: uuid
        player_id:
          type: string
        name:
          type: string
        avatar_type:
          type: string
        level:
          type: integer
        xp:
          type: integer
        coins:
          type: integer
      required: [id, guild_id, player_id, name, avatar_type, level, xp, coins]

    HunterStatsBreakdown:
      type: object
      properties:
        str_xp: { type: integer }
        int_xp: { type: integer }
        agi_xp: { type: integer }
        cha_xp: { type: integer }
        vit_xp: { type: integer }
        none_xp: { type: integer }
      required: [str_xp, int_xp, agi_xp, cha_xp, vit_xp, none_xp]

    HunterStats:
      type: object
      properties:
        hunter_id:
          type: string
          format: uuid
        guild_id:
          type: string
          format: uuid
        stat_xp:
          $ref: '#/components/schemas/HunterStatsBreakdown'
        total_xp:
          type: integer
        total_coins:
          type: integer
        entry_count:
          type: integer
      required: [hunter_id, guild_id, stat_xp, total_xp, total_coins, entry_count]

    CreateQuestRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        reward_xp:
          type: integer
        reward_coins:
          type: integer
        stat_category:
          type: string
          enum: [STR, INT, AGI, VIT, CHA, NONE]
        category:
          type: string
          enum: [chore, study, exam, habit]
        assigned_hunter_id:
          type: string
          format: uuid
          nullable: true
        cadence:
          type: string
          enum: [daily, weekly]
          nullable: true
      required: [title, reward_xp, reward_coins]

    SubmitQuestRequest:
      type: object
      properties:
        proof_note:
          type: string
          nullable: true

    ReviewQuestRequest:
      type: object
      properties:
        approved:
          type: boolean
        hunter_id:
          type: string
          format: uuid
          nullable: true
        review_note:
          type: string
          nullable: true
      required: [approved]

    QuestProofMedia:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quest_id:
          type: string
          format: uuid
        original_filename:
          type: string
          nullable: true
        mime_type:
          type: string
        byte_size:
          type: integer
        content_path:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, quest_id, mime_type, byte_size, content_path, created_at]

    Quest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        guild_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        reward_xp:
          type: integer
        reward_coins:
          type: integer
        stat_category:
          type: string
        category:
          type: string
        assigned_hunter_id:
          type: string
          format: uuid
          nullable: true
        created_by_hunter_id:
          type: string
          format: uuid
          nullable: true
        cadence:
          type: string
          nullable: true
        streak_count:
          type: integer
        best_streak:
          type: integer
        completions_count:
          type: integer
        proof_note:
          type: string
          nullable: true
        proof_submitted_at:
          type: string
          format: date-time
          nullable: true
        last_completed_at:
          type: string
          format: date
          nullable: true
        last_review_note:
          type: string
          nullable: true
        proof_media:
          type: array
          items:
            $ref: '#/components/schemas/QuestProofMedia'
        updated_at:
          type: string
          format: date-time
        status:
          type: string
      required:
        - id
        - guild_id
        - title
        - reward_xp
        - reward_coins
        - stat_category
        - category
        - streak_count
        - best_streak
        - completions_count
        - proof_media
        - updated_at
        - status

    HunterRewardSnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        guild_id:
          type: string
          format: uuid
        level:
          type: integer
        xp:
          type: integer
        coins:
          type: integer
      required: [id, guild_id, level, xp, coins]

    ReviewRewardEvent:
      type: object
      properties:
        reward_event_id:
          type: string
          format: uuid
        hunter_id:
          type: string
          format: uuid
        gained_xp:
          type: integer
        gained_coins:
          type: integer
        leveled_up:
          type: boolean
        new_level:
          type: integer
      required:
        - reward_event_id
        - hunter_id
        - gained_xp
        - gained_coins
        - leveled_up
        - new_level

    ReviewQuestResponse:
      type: object
      properties:
        quest:
          $ref: '#/components/schemas/Quest'
        hunter:
          allOf:
            - $ref: '#/components/schemas/HunterRewardSnapshot'
          nullable: true
        reward:
          allOf:
            - $ref: '#/components/schemas/ReviewRewardEvent'
          nullable: true
      required: [quest]

    PlayerIdRequest:
      type: object
      properties:
        player_id:
          type: string
      required: [player_id]

    RespondBooleanRequest:
      type: object
      properties:
        accept:
          type: boolean
      required: [accept]

    FriendProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        player_id:
          type: string
        name:
          type: string
        guild_id:
          type: string
          format: uuid
        avatar_type:
          type: string
        level:
          type: integer
        xp:
          type: integer
        coins:
          type: integer
      required: [id, player_id, name, guild_id, avatar_type, level, xp, coins]

    FriendRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requester_hunter_id:
          type: string
          format: uuid
        requester_player_id:
          type: string
        requester_name:
          type: string
        target_hunter_id:
          type: string
          format: uuid
        target_player_id:
          type: string
        target_name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - requester_hunter_id
        - requester_player_id
        - requester_name
        - target_hunter_id
        - target_player_id
        - target_name
        - status
        - created_at

    GuildInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        guild_id:
          type: string
          format: uuid
        inviter_hunter_id:
          type: string
          format: uuid
        inviter_player_id:
          type: string
        inviter_name:
          type: string
        invited_hunter_id:
          type: string
          format: uuid
        invited_player_id:
          type: string
        invited_name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - guild_id
        - inviter_hunter_id
        - inviter_player_id
        - inviter_name
        - invited_hunter_id
        - invited_player_id
        - invited_name
        - status
        - created_at

    SocialProfile:
      type: object
      properties:
        guild_id:
          type: string
          format: uuid
        guild_name:
          type: string
        role_title:
          type: string
        player_id:
          type: string
          nullable: true
        hunter_tag:
          type: string
        display_name:
          type: string
        level:
          type: integer
        xp:
          type: integer
        coins:
          type: integer
        motto:
          type: string
          nullable: true
      required:
        - guild_id
        - guild_name
        - role_title
        - hunter_tag
        - display_name
        - level
        - xp
        - coins

    UpdateSocialProfileRequest:
      type: object
      properties:
        motto:
          type: string
          nullable: true

    PlayerPassQr:
      type: object
      properties:
        qr_value:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        expires_at:
          type: string
          format: date-time
      required: [qr_value, token_type, expires_in, expires_at]

    PersistDirectMessageRequest:
      type: object
      properties:
        recipient_hunter_id:
          type: string
          format: uuid
        content:
          type: string
        client_message_id:
          type: string
          format: uuid
          nullable: true
        sent_at_ms:
