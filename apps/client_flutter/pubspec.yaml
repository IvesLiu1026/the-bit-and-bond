name: the_bit_and_bond_client
description: A cozy guild-life RPG app for The Bit and Bond
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_preview: ^1.2.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flame: ^1.20.0
  http: ^1.2.2
  livekit_client: ^2.11.0
  audioplayers: ^6.1.0
  uuid: ^4.5.1
  web_socket_channel: ^3.0.1
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  google_sign_in: ^7.2.0
  cryptography: ^2.7.0
  image_picker: ^1.1.2
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sprites/hero/Free Pixel Character Base Pack/character.png
    - assets/sprites/hero/LICENSE.txt
    - assets/sprites/hero/Free Pixel Character Base Pack/licence.txt.txt
    - assets/environment/
    - assets/audio/coin.wav
    - assets/audio/door_open.wav
    - assets/audio/use_success.wav
  fonts:
    - family: FusionPixelZhHant
      fonts:
        - asset: assets/fonts/fusion-pixel-10px-proportional-zh_hant.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
        - asset: assets/fonts/Nunito-Italic-Variable.ttf
          style: italic
