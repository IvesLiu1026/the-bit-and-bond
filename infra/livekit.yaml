# Local/dev LiveKit configuration for chen-leveling voice MVP.
# For production, replace keys and run behind TLS.
port: 7880
bind_addresses:
  - "0.0.0.0"

keys:
  devkey: devsecret

redis:
  address: redis:6379

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  # STUN fallback for local testing.
  stun_servers:
    - stun.l.google.com:19302

logging:
  level: info
