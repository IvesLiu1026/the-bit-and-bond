services:
  postgres:
    image: postgres:16
    container_name: the_bit_and_bond_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chen
      POSTGRES_PASSWORD: chen
      POSTGRES_DB: the_bit_and_bond
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
